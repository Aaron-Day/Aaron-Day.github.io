name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      max-requests:
        description: 'TMDB requests this run (0 = unlimited)'
        required: false
        default: '40'
      # Deliberately NO force-refresh input, though the design spec still describes one.
      # EnrichOptions.Load refuses --force-refresh with a non-zero budget, because a forced run never loads
      # the committed index and SaveAsync replaces it whole, so one that stops on its budget leaves the index
      # holding only the fraction it re-fetched. An input defaulting to the 40 above would therefore exit 1 on
      # its first use. If it is ever wanted, it has to set max-requests to 0 in the same dispatch.

# One run at a time. Two runs enriching at once spend the budget twice on the SAME titles, and the second
# cache push is then a non-fast-forward that is rejected, throwing that run's requests away with a git error
# that reads as unrelated. A push landing during the Monday cron is enough to cause it. Never
# cancel-in-progress: cancelling a run mid-enrich is precisely how a spent budget is wasted, and queueing
# means the second run checks out after the first has pushed its cache, so it starts from the fuller index.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Third-party actions are pinned to commit SHAs, not to the mutable vN tags they also publish. This repository
      # is public and this job has `contents: write` with the TMDB secret in scope, so a tag repointed at new code -
      # by the owner of that action, or by anyone who takes over the account - would run with write access to master
      # and to gh-pages on the next push. A SHA cannot be repointed. The comment is the human-readable version the
      # SHA was the tip of; bump both together when updating, after reading the release notes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --nologo --verbosity normal

      # Writes the catalogue to src/MovieLibrary.Web/wwwroot/data/ (gitignored; the publish below picks it
      # up from the working tree) and grows enrich-cache/ (committed). It exits 0 whenever a catalogue was
      # written, a spent request budget included, so the exit code cannot be the deploy gate: the gate is
      # the `deployable` output this step appends to $GITHUB_OUTPUT on every outcome. The step also writes
      # its own Markdown job summary.
      - name: Enrich catalog from TMDB
        id: enrich
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          # Empty on push and schedule, and the tool then applies its own default of 40. Deliberately not
          # `|| '40'`: the unlimited seeding run is dispatched with '0', which `|| '40'` could discard.
          MAX_REQUESTS_PER_RUN: ${{ github.event.inputs.max-requests }}
        run: dotnet run --project src/MovieLibrary.Enrich -c Release

      # Every TMDB response this run paid for is already in enrich-cache/ (the tool saves it in a finally),
      # so this runs after a failed or cancelled run too - that is when it matters most. It is conditioned
      # on cache_saved rather than on the job's status: when the tool reports it could NOT save the cache,
      # CacheStore.SaveAsync has truncated index.json in place without finishing it, and committing that
      # would overwrite the committed index that CacheStore's own docs name as the way to restore it.
      - name: Commit cache growth
        if: always() && steps.enrich.outputs.cache_saved == 'true' && github.ref_type == 'branch'
        env:
          # The push needs an explicit refspec: actions/checkout can leave HEAD detached, and a bare
          # `git push` then has no branch to send. ref_name is the branch the run was triggered on (master
          # for push and schedule), passed through the environment rather than interpolated into the script.
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- enrich-cache
          if git diff --cached --quiet -- enrich-cache; then
            echo "No cache growth to commit."
            exit 0
          fi
          git commit -m "chore(enrich): grow the TMDB match cache [skip ci]"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      # Not part of the deploy gate: a catalogue that was published is sound whatever happened to the cache.
      # But a runner that cannot save it re-spends the whole request budget on every run, and the step above
      # was skipped, so it is said here as well as in the job summary.
      - name: Warn that the TMDB cache was not saved
        if: always() && steps.enrich.outputs.cache_saved == 'false'
        run: |
          echo "::warning title=TMDB cache not saved::This run's TMDB responses were not banked, so the next run pays for them again. enrich-cache/ was deliberately NOT committed: the index may be half-written, and the committed copy is what it would be restored from. The job summary says why."

      # A skipped deploy has to be visible. The gate below leaves the job GREEN with a clean check mark,
      # which is right for a budget stop but means a run that quietly stopped updating the live site looks
      # exactly like one that updated it - and the only trace is inside a job summary nobody opens. Cache
      # entries expire at five months, so the weekly cron on the default 40-request budget will land here
      # roughly twice a year. This also catches the case where enrich exits 0 but wrote no outputs at all
      # (its $GITHUB_OUTPUT write failed and was swallowed as advisory), where every gated step skips.
      # A bare echo cannot fail the job, so the run stays green while saying what happened.
      - name: Warn that the deploy was skipped
        if: always() && steps.enrich.outcome == 'success' && steps.enrich.outputs.deployable != 'true'
        run: |
          echo "::warning title=Deploy skipped::The catalogue was not complete, so the live site was left as it was (stopped_on_budget=${{ steps.enrich.outputs.stopped_on_budget }}). Re-run with max-requests 0 to finish the library. The job summary says what is missing."

      # The deploy gate. `deployable` is true only for a complete, real catalogue: it is false for a
      # budget-stopped run (films carry sheet data only and series collapse to season 0), for --fixtures,
      # and for every failure. A gated-off run leaves these steps skipped and the job green, which a budget
      # stop - the normal development path - should be. `!cancelled()` rather than the implied success() so
      # that a cache push losing a race does not also withhold a sound catalogue.
      # One step, not three. Given the same `if` on each, none of them depended on the one before it: a
      # `dotnet publish` that failed AFTER it began copying static web assets would leave a real
      # release/wwwroot/index.html behind, the next two steps would succeed on it, and the deploy would
      # publish a partial site. GitHub runs `run:` scripts under `bash -e`, so folding them makes the whole
      # publish succeed or fail as one thing.
      - name: Publish the site
        id: publish
        if: ${{ !cancelled() && steps.enrich.outputs.deployable == 'true' }}
        run: |
          dotnet publish src/MovieLibrary.Web -c Release -o release --nologo
          cp release/wwwroot/index.html release/wwwroot/404.html   # deep links: Pages serves 404.html, which reboots the app
          touch release/wwwroot/.nojekyll                          # without it Pages hides _framework/

      - name: Deploy to gh-pages
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: release/wwwroot
