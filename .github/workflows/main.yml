name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      max-requests:
        description: 'TMDB requests this run (0 = unlimited)'
        required: false
        default: '40'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --nologo --verbosity normal

      - name: Publish
        run: dotnet publish src/MovieLibrary.Web -c Release -o release --nologo

      - name: Copy index.html to 404.html for deep links
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Add .nojekyll so _framework is served
        run: touch release/wwwroot/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: release/wwwroot
